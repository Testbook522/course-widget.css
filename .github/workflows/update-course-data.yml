name: Update Course Widget Data

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-course-widget-data
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download latest Redash query 9085
        env:
          REDASH_API_KEY: ${{ secrets.REDASH_API_KEY }}
        run: |
          set -euo pipefail
          test -n "${REDASH_API_KEY:-}" || (echo "REDASH_API_KEY secret is missing" >&2 && exit 1)
          curl --fail --silent --show-error --location --retry 3 \
            --header "Authorization: Key ${REDASH_API_KEY}" \
            "https://data.testbook.com/api/queries/9085/results.csv" \
            --output /tmp/courses.csv
          test -s /tmp/courses.csv || (echo "Redash returned an empty CSV" >&2 && exit 1)
          test "$(wc -l < /tmp/courses.csv)" -gt 1 || \
            (echo "Redash CSV contains no course rows" >&2 && exit 1)

      - name: Generate all SuperGroup feeds and pages
        run: |
          set -euo pipefail
          python3 "${GITHUB_WORKSPACE}/scripts/update_course_data.py" \
            /tmp/courses.csv "${GITHUB_WORKSPACE}/data"

      - name: Commit generated data and pages
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data *.html widget.css widget.js scripts/update_course_data.py update_course_data.py
          if git diff --cached --quiet; then
            echo "No course changes"
            exit 0
          fi
          git commit -m "Update course widget data"
          git push
