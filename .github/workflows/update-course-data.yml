name: Update Course Widget Data

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-course-widget-data
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download latest Redash query 9085
        env:
          REDASH_API_KEY: ${{ secrets.REDASH_API_KEY }}
        run: |
          test -n "$REDASH_API_KEY" || (echo "REDASH_API_KEY secret is missing" && exit 1)

          curl --fail --silent --show-error --location \
            "https://data.testbook.com/api/queries/9085/results.csv?api_key=${REDASH_API_KEY}" \
            --output /tmp/courses.csv

          test "$(wc -l < /tmp/courses.csv)" -gt 100 || \
            (echo "Redash CSV looks incomplete" && exit 1)

      - name: Generate public widget data
        run: |
          python scripts/update_course_data.py /tmp/courses.csv data

      - name: Commit data changes
        run: |
          if git diff --quiet -- data; then
            echo "No course changes"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data
          git commit -m "Update course widget data"
          git push
