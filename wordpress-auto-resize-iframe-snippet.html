<!-- Add this ONCE on pages that contain Testbook course-widget iframes. -->
<style>
iframe[src*="testbook522.github.io/course-widget.css/"] {
  display: block !important;
  width: 100% !important;
  max-width: 100% !important;
  height: 360px;
  min-height: 0 !important;
  border: 0 !important;
  overflow: hidden !important;
}
</style>
<script>
(function () {
  if (window.__tbCourseIframeResizeInstalled) return;
  window.__tbCourseIframeResizeInstalled = true;

  window.addEventListener("message", function (event) {
    if (event.origin !== "https://testbook522.github.io") return;
    var data = event.data || {};
    if (data.type !== "tb-course-widget-height") return;
    var height = Math.max(180, Math.min(900, Number(data.height) || 0));
    if (!height) return;

    document.querySelectorAll('iframe[src*="testbook522.github.io/course-widget.css/"]').forEach(function (frame) {
      if (frame.contentWindow === event.source) {
        frame.style.setProperty("height", height + "px", "important");
        frame.style.setProperty("min-height", "0", "important");
      }
    });
  });
})();
</script>

<!-- Example: Engineering -->
<iframe
  src="https://testbook522.github.io/course-widget.css/engineering.html"
  title="Active Engineering Courses"
  loading="lazy"
  scrolling="no"
  style="width:100%;height:360px;border:0;display:block;"
></iframe>
