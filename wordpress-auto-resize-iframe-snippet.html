<!-- Add this once on pages that contain Testbook course-widget iframes. -->
<style>
iframe[src*="testbook522.github.io/course-widget.css/"] {
  display: block !important;
  width: 100% !important;
  max-width: 100% !important;
  height: 180px;
  min-height: 0 !important;
  border: 0 !important;
  overflow: hidden !important;
}
</style>
<script>
(function () {
  "use strict";
  if (window.__tbCourseIframeResizeInstalled) return;
  window.__tbCourseIframeResizeInstalled = true;

  var selector = 'iframe[src*="testbook522.github.io/course-widget.css/"]';

  function resizeFrame(frame, value) {
    var height = Number(value);
    if (!Number.isFinite(height) || height <= 0) return;
    height = Math.max(120, Math.min(2000, Math.ceil(height)));
    frame.style.setProperty("height", height + "px", "important");
    frame.style.setProperty("min-height", "0", "important");
  }

  function watchFrame(frame) {
    if (frame.__tbResizeWatched) return;
    frame.__tbResizeWatched = true;
    frame.addEventListener("load", function () {
      frame.style.setProperty("height", "180px", "important");
    });
  }

  function watchFrames() {
    document.querySelectorAll(selector).forEach(watchFrame);
  }

  window.addEventListener("message", function (event) {
    if (event.origin !== "https://testbook522.github.io") return;
    var data = event.data || {};
    if (data.type !== "tb-course-widget-height") return;
    document.querySelectorAll(selector).forEach(function (frame) {
      if (frame.contentWindow === event.source) resizeFrame(frame, data.height);
    });
  });

  watchFrames();
  if ("MutationObserver" in window) {
    new MutationObserver(watchFrames).observe(document.documentElement, { childList: true, subtree: true });
  }
})();
</script>

<!-- Example: Engineering -->
<iframe
  src="https://testbook522.github.io/course-widget.css/engineering.html"
  title="Active Engineering Courses"
  loading="lazy"
  scrolling="no"
